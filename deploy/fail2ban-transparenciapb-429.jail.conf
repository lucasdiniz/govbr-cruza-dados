# fail2ban jail: ban IPs que excedem rate limit (429) repetidamente.
#
# Threshold: 10 hits 429 em 5min = ban por 1h (banaction padrao da distro,
# a mesma do jail sshd).
# Tunes em production se necessario (ban time, find time, max retry).
#
# Instalado em /etc/fail2ban/jail.d/transparenciapb-429.conf por
# deploy/setup-fail2ban.sh.

# backend = auto e OBRIGATORIO: o Ubuntu define backend = systemd como
# default, e com ele o fail2ban ignora `logpath` e le o journal — onde o
# access.log do nginx nao existe. Resultado: jail ativo com 0 matches.
[transparenciapb-429]
enabled  = true
backend  = auto
port     = http,https
filter   = transparenciapb-429
logpath  = /var/log/nginx/access.log
maxretry = 10
findtime = 300
bantime  = 3600
